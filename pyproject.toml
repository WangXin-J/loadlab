[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadlab"
version = "0.1.0"
description = "WebSocket 长连接压测与容量拐点分析"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0,<15.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loadlab = "loadlab.cli:main"

[tool.setuptools]
packages = ["loadlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
