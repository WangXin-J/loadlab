name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit & integration tests
        run: pytest -q

      - name: Load smoke test (naive vs optimized)
        run: |
          mkdir -p report
          python target/push_server.py --port 8765 --mode naive --interval 0.1 \
            --stats report/server-stats-naive.jsonl &
          sleep 3
          loadlab run --target ws://127.0.0.1:8765 --stages 5,20,40 --duration 4 \
            --server-stats report/server-stats-naive.jsonl --out report/naive.json

          python target/push_server.py --port 8766 --mode optimized --interval 0.1 \
            --stats report/server-stats-opt.jsonl &
          sleep 3
          loadlab run --target ws://127.0.0.1:8766 --stages 5,20,40 --duration 4 \
            --server-stats report/server-stats-opt.jsonl --out report/optimized.json

          loadlab report --inputs report/naive.json report/optimized.json \
            --labels naive optimized --out report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadlab-report
          path: report/
          if-no-files-found: ignore
